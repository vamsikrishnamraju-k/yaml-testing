apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: python

  template:
    metadata:
      labels:
        app: python

    spec:
      containers:
      - name: python-container
        image: vamsikrishnamraju/train:v1
        ports:
        - containerPort: 5001

---
apiVersion: v1
kind: Service

metadata:
  name: train-service

spec:
  type: ClusterIP

  selector:
    app: python

  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001
